name: CI
env:
  DEBUG: napi:*
  APP_NAME: yara-x
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
      - docs/**
  pull_request:
    branches:
      - main
    # No `paths` filter here on purpose. The `setup` job's diff check already
    # decides whether the expensive build/test matrix runs, so every pull
    # request gets a fast `CI Gate` status instead of no status at all (a
    # missing required check blocks a merge indefinitely).
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
      src: ${{ steps.diff.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify platform package licenses
        # Each platform package ships a LICENSE file that npm includes regardless
        # of the "files" array. Fail the pull request if those files are missing
        # or no longer match the root license files.
        run: node scripts/platform-licenses.mjs --check
      - name: Detect source changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          # Release, manual dispatch, and any other non-push/PR event always build.
          if [[ "$EVENT" != "pull_request" && "$EVENT" != "push" ]]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to "build" if the base commit is unavailable (first push, force-push).
          if ! git rev-parse --verify --quiet "${BASE}" >/dev/null; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE}..HEAD" | grep -qxE 'src/.*|__test__/.*|Cargo.toml|Cargo.lock|build.rs|package.json|pnpm-lock.yaml|index.js|index.d.ts|\.cargo/.*|\.github/workflows/CI\.yml'; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set matrix
        id: set-matrix
        run: |
          # Define x64 targets (Linux, Windows, macOS)
          X64_TARGETS='[
            {
              "host": "macos-latest",
              "target": "x86_64-apple-darwin",
              "build": "pnpm build --target x86_64-apple-darwin"
            },
            {
              "host": "ubuntu-latest",
              "target": "x86_64-unknown-linux-gnu",
              "build": "pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross"
            },
            {
              "host": "windows-latest",
              "target": "x86_64-pc-windows-msvc",
              "build": "pnpm build --target x86_64-pc-windows-msvc"
            },
            {
              "host": "ubuntu-latest",
              "target": "x86_64-unknown-linux-musl",
              "build": "pnpm build --target x86_64-unknown-linux-musl --cross-compile",
              "musl": true
            }
          ]'

          # Define ARM/Cross targets
          ARM_TARGETS='[
            {
              "host": "macos-latest",
              "target": "aarch64-apple-darwin",
              "build": "pnpm build --target aarch64-apple-darwin"
            },
            {
              "host": "windows-latest",
              "target": "aarch64-pc-windows-msvc",
              "build": "pnpm build --target aarch64-pc-windows-msvc"
            },
            {
              "host": "ubuntu-latest",
              "target": "aarch64-unknown-linux-gnu",
              "build": "pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross"
            },
            {
              "host": "ubuntu-latest",
              "target": "aarch64-unknown-linux-musl",
              "build": "pnpm build --target aarch64-unknown-linux-musl --cross-compile",
              "musl": true
            }
          ]'

          # Test matrix for x64
          TEST_X64='[
            { "host": "macos-latest", "target": "x86_64-apple-darwin", "architecture": "x64" },
            { "host": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "architecture": "x64" },
            { "host": "windows-latest", "target": "x86_64-pc-windows-msvc", "architecture": "x64" },
            { "host": "ubuntu-latest", "target": "x86_64-unknown-linux-musl", "architecture": "x64", "musl": true }
          ]'

          # Test matrix for ARM
          TEST_ARM='[
            { "host": "macos-latest", "target": "aarch64-apple-darwin", "architecture": "arm64" }
          ]'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR: Only x64
            BUILD_MATRIX=$(echo "$X64_TARGETS" | jq -c .)
            TEST_MATRIX=$(echo "$TEST_X64" | jq -c .)
          else
            # Push/Release: All targets
            BUILD_MATRIX=$(jq -n -c --argjson x64 "$X64_TARGETS" --argjson arm "$ARM_TARGETS" '$x64 + $arm')
            TEST_MATRIX=$(jq -n -c --argjson x64 "$TEST_X64" --argjson arm "$TEST_ARM" '$x64 + $arm')
          fi

          echo "build_matrix={\"settings\":$BUILD_MATRIX}" >> $GITHUB_OUTPUT
          echo "test_matrix={\"settings\":$TEST_MATRIX,\"node\":[\"22\"]}" >> $GITHUB_OUTPUT
  build:
    needs: setup
    if: needs.setup.outputs.src == 'true'
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$HOME\.cargo"
      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.0
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Setup Zig
        # musl targets are cross-compiled with cargo-zigbuild, which needs zig for
        # the C toolchain. Pinned so a zig release cannot break the build.
        if: matrix.settings.musl
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install cargo-zigbuild
        # napi-rs installs this on first use; pinning it keeps releases
        # reproducible and avoids pulling a version incompatible with zig 0.17.
        if: matrix.settings.musl
        run: cargo install cargo-zigbuild --locked --version 0.23.4
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.settings.target }}-${{ matrix.settings.host }}
          cache-on-failure: false
          cache-directories: |
            ~/.napi-rs
            .cargo-cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify Cargo lockfile
        run: cargo metadata --locked --format-version 1
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "*.node"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error
  test-bindings:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    permissions:
      contents: read
    needs:
      - setup
      - build
    if: needs.setup.outputs.src == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: Test bindings
        if: ${{ !matrix.settings.musl }}
        run: node --test --test-concurrency 1 __test__/index.spec.mjs
      - name: Test bindings (musl)
        # A glibc Node.js cannot dlopen a musl addon, so the same suite runs inside
        # Alpine against the musl binary. arm64 musl is built but not executed
        # here, matching the existing practice for aarch64-unknown-linux-gnu.
        if: matrix.settings.musl
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work "node:${{ matrix.node }}-alpine" \
            node --test --test-concurrency 1 __test__/index.spec.mjs
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: main
    permissions:
      contents: write
      id-token: write
    needs:
      - build
      - test-bindings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.0
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install --global npm@^11.5.1
      - name: Print publish toolchain
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: create npm dirs
        run: pnpm napi create-npm-dirs
      - name: Move artifacts
        run: pnpm artifacts
      - name: Verify every package will ship a license
        # `pnpm napi create-npm-dirs` above rewrote npm/*/package.json and
        # hard-codes "files" to the native binary, so a platform package can only
        # ship a license through the LICENSE file we commit. Check with npm's own
        # packlist, before anything is published, that each package really
        # includes one.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/platform-licenses.mjs --check
          node -e '
            const { execFileSync } = require("node:child_process");
            const { existsSync, readdirSync } = require("node:fs");
            let failed = false;
            for (const entry of readdirSync("npm", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const dir = `npm/${entry.name}`;
              if (!existsSync(`${dir}/package.json`)) continue;
              const [packed] = JSON.parse(
                execFileSync("npm", ["pack", `./${dir}`, "--dry-run", "--json", "--ignore-scripts"], { encoding: "utf8" }),
              );
              const licensed = packed.files.some((f) => /^(LICENSE|LICENCE|COPYING)/i.test(f.path));
              console.log(`${licensed ? "ok  " : "FAIL"} ${packed.name} ships ${packed.files.length} file(s)`);
              if (!licensed) failed = true;
            }
            if (failed) {
              console.error("A package would be published without a license file.");
              process.exit(1);
            }
          '
          ls -R ./npm
      - name: Publish platform sub-packages
        # Publish each platform-specific sub-package from ./npm/*
        # Uses OIDC trusted publishing (no NPM_TOKEN needed).
        # --ignore-scripts prevents prepublishOnly from re-running napi prepublish
        # which would attempt to re-create the GitHub release and fail with 422.
        run: |
          TAG_ARGS=""
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            TAG_ARGS="--tag next"
          fi
          for pkg_dir in ./npm/*/; do
            pkg_name=$(node -p "require('./${pkg_dir}package.json').name")
            pkg_version=$(node -p "require('./${pkg_dir}package.json').version")
            if [[ "$(npm view "$pkg_name@$pkg_version" version 2>/dev/null || true)" == "$pkg_version" ]]; then
              echo "Already published: $pkg_name@$pkg_version — skipping"
              continue
            fi
            echo "Publishing $pkg_dir"
            npm publish "$pkg_dir" $TAG_ARGS --access public --provenance --ignore-scripts
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync optionalDependencies to current version
        # The native sub-packages were just published above. Sync the root
        # optionalDependencies to the package version so installs resolve the
        # matching native binaries, not a previous release's. This runs at
        # publish time (not prepare time) because the new versions only exist on
        # npm after the sub-package publish loop above.
        #
        # The set is discovered from ./npm rather than hard-coded, so a newly
        # added target is picked up automatically. It also cannot live in the
        # committed manifest: a platform package that is not on the registry yet
        # would make `pnpm install --frozen-lockfile` unresolvable until it is
        # published once.
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = pkg.version;
            const prefix = pkg.name + "-";
            const platforms = fs
              .readdirSync("npm", { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => JSON.parse(fs.readFileSync(`npm/${entry.name}/package.json`, "utf8")).name)
              .filter((name) => name.startsWith(prefix))
              .sort();
            pkg.optionalDependencies = Object.fromEntries(platforms.map((name) => [name, version]));
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`Synced ${platforms.length} optionalDependencies to ${version}`);
          '
      - name: Publish main package
        # Publish root package last (--ignore-scripts skips prepublishOnly / napi prepublish
        # which would try to create a GitHub release that already exists).
        run: |
          pkg_name=$(node -p "require('./package.json').name")
          pkg_version=$(node -p "require('./package.json').version")
          if [[ "$(npm view "$pkg_name@$pkg_version" version 2>/dev/null || true)" == "$pkg_version" ]]; then
            echo "Already published: $pkg_name@$pkg_version — skipping"
          elif [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            npm publish --tag next --access public --provenance --ignore-scripts
          else
            npm publish --access public --provenance --ignore-scripts
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        # Keyless Sigstore signing via the GitHub OIDC token (id-token: write).
        # Used to sign the native .node artifacts attached to the release.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attach release assets
        # Attach the native .node binaries to the GitHub release and sign each
        # one keyless with Sigstore (producing a .sigstore bundle). This is what
        # the OpenSSF Scorecard 'Signed-Releases' check looks for (signature
        # files among the release assets), and lets consumers verify downloads:
        #   cosign verify-blob --bundle yara-x.<target>.node.sigstore \
        #     yara-x.<target>.node \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        # (the certificate identity is this repo's CI workflow, at the ref that
        # ran the publish job). Runs after npm publish so a signing failure never
        # blocks the package.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist; skipping release-asset signing."
            exit 0
          fi
          mkdir -p release-assets
          # Flatten the platform-named .node binaries into one directory.
          find npm -type f -name '*.node' -exec cp {} release-assets/ \;
          echo "Collected $(ls release-assets/*.node | wc -l | tr -d ' ') native artifacts:"
          ls -1 release-assets/
          cd release-assets
          # Sign each binary keyless; --bundle writes a Sigstore bundle (.sigstore).
          for f in *.node; do
            echo "Signing $f ..."
            cosign sign-blob --yes --bundle "${f}.sigstore" "$f"
          done
          cd ..
          gh release upload "$TAG" release-assets/*.node release-assets/*.sigstore --clobber
          echo "Attached $(ls release-assets/*.sigstore | wc -l | tr -d ' ') signed assets to $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Single, always-present status for branch protection. The matrix jobs are
  # intentionally skipped when a pull request does not touch source, and a
  # skipped job never reports a status — which would leave a required check
  # "expected" forever and block the merge. This job always reports, and fails
  # only when a required job actually failed or was cancelled.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - setup
      - build
      - test-bindings
    permissions:
      contents: read
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.setup.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.test-bindings.result }}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A required CI job reported '$result'."
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs passed or were correctly skipped."
