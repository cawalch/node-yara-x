name: Create Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
"on":
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish with npm dist-tag next
        required: true
        default: false
        type: boolean
      notes:
        description: Optional release notes
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: github.repository == 'cawalch/node-yara-x'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
          RELEASE_NOTES: ${{ github.event.inputs.notes }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists."
            exit 1
          fi

          args=(
            "$tag"
            --target main
            --title "$tag"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if [[ -n "$RELEASE_NOTES" ]]; then
            args+=(--notes "$RELEASE_NOTES")
          else
            args+=(--generate-notes)
          fi

          gh release create "${args[@]}"
      - name: Ensure publish pipeline triggers
        # The `release: [published]` event is occasionally dropped by GitHub
        # (observed once for v0.7.1 — the tag existed but no release-event CI
        # run spawned). Poll briefly for the release-event CI run on the new
        # tag; if it never appears, dispatch CI.yml manually. Its publish job
        # accepts workflow_dispatch on main, and the publish steps skip
        # versions that already exist on npm, so a late event cannot
        # double-publish.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          for i in $(seq 1 18); do
            run_id=$(gh run list --workflow CI.yml --event release --branch "$tag" --json databaseId --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then
              echo "Release-event CI run $run_id found for $tag."
              exit 0
            fi
            sleep 10
          done
          echo "No release-event CI run within 180s; dispatching CI.yml on main."
          gh workflow run CI.yml --ref main
