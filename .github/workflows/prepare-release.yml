name: Prepare Release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
"on":
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
      force:
        description: Open a release PR even if there are no commits since the current version tag
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 14 1 * *"
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  prepare-release:
    name: Prepare release PR
    runs-on: ubuntu-latest
    if: github.repository == 'cawalch/node-yara-x'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Ensure cache directory exists
        run: mkdir -p $(pnpm store path --silent)
      - name: Decide whether a release PR is needed
        id: release
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force || 'false' }}
        run: |
          current_version=$(node -p "require('./package.json').version")
          current_tag="v${current_version}"

          if ! git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=Version ${current_version} is already prepared and has no matching tag." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE_RELEASE" != "true" ]] && ! git log --format=%H "${current_tag}..HEAD" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=No commits since ${current_tag}." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.release.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        # Build the native binding from source so verification tests the
        # current commit, not the previously-published optional-dependency
        # binary. Without this, `pnpm test` resolves @litko/yara-x-<platform>
        # from npm (a prior release built against an older yara-x) and any
        # test exercising newer compiler behavior fails spuriously.
        if: steps.release.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install native build dependencies
        # yara-x's build requires protoc (protobuf-compiler).
        if: steps.release.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Prepare version bump
        if: steps.release.outputs.skip != 'true'
        id: bump
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || 'patch' }}
        run: |
          next_version=$(node scripts/prepare-release.mjs "$RELEASE_TYPE")
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
      - name: Refresh lockfile
        if: steps.release.outputs.skip != 'true'
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify release prep
        if: steps.release.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build:debug
          cargo metadata --locked --format-version 1 >/dev/null
          pnpm test
      - name: Setup Keyless Signing (Gitsign)
        if: steps.release.outputs.skip != 'true'
        uses: chainguard-dev/actions/setup-gitsign@a9d4aa7202a63f8a6b8f81bb1570a0ca54460ac5 # v1.6.34
      - name: Open release pull request
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v${NEXT_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          # index.js/index.d.ts are regenerated by the "Verify release prep"
          # step (pnpm build:debug runs napi build). Without committing them,
          # the released artifact's NAPI_RS_ENFORCE_VERSION_CHECK strings lag
          # one version behind the package (observed at v0.7.0 and v0.7.1).
          git add package.json pnpm-lock.yaml npm/*/package.json index.js index.d.ts
          git commit -S -m "chore: prepare v${NEXT_VERSION} release"
          git push --force-with-lease --set-upstream origin "$branch"

          existing_pr=$(gh pr list --head "$branch" --base main --json number --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "chore: prepare v${NEXT_VERSION} release" \
              --body "Prepares v${NEXT_VERSION} for release. This PR only bumps package versions and refreshes the pnpm lockfile. Publishing remains gated by creating the GitHub release after merge."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: prepare v${NEXT_VERSION} release" \
              --body "Prepares v${NEXT_VERSION} for release. This PR only bumps package versions and refreshes the pnpm lockfile. Publishing remains gated by creating the GitHub release after merge."
          fi
      - name: Summarize skipped release
        if: steps.release.outputs.skip == 'true'
        run: echo "${{ steps.release.outputs.reason }}"
